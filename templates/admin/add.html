{% extends "admin/base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-4">Add Item</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" name="item_name" title="item_name" type="text" value="Nqobile" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control" name="item_price" title="item_price" type="number" value="900" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="item_category" title="item_category" required>
                    <option disabled selected>Select Category</option>
                    <option value="Hairstyles">Hairstyles</option>
                    <option value="Wigs">Wigs</option>
                    <option value="Nails">Nails</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Picture</label>
                <input class="form-control" name="item_image" title="item_image" type="file" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="item_description" title="item_description" rows="4">Hello World</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Add</button>
                <a href="{{ url_for('admin_catalog_route') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
