<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carol's Beauty Lounge{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T6L9u0DVCZwNmmQ3xiyxCg+0qZ3KYw5t2Lr852DmQokxG1Cj7eH8w4Svz2fkg+2d" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

{% if request.endpoint not in ['admin_login_page', 'exit_admin_route'] %}
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('admin_home_route') }}">Carol's Beauty Lounge</a>
            <button class="navbar-toggler" type="button" id="hamburger" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="nav-links navbar-nav ms-auto align-items-center" id="nav-links">
                <a class="nav-link {% if request.endpoint == 'admin_home_route' %}active{% endif %}" href="{{ url_for('admin_home_route') }}">Home</a>
                <a class="nav-link {% if request.endpoint in ['admin_catalog_route', 'admin_add_route', 'edit_item_route', 'delete_item_route'] %}active{% endif %}" href="{{ url_for('admin_catalog_page') }}">Catalog</a>
                <a class="nav-link {% if request.endpoint in ['admin_appointments_route', 'admin_create_appointment_route'] %}active{% endif %}" href="{{ url_for('admin_appointments_route') }}">Appointments</a>
                <a class="nav-link {% if request.endpoint == 'admin_about_route' %}active{% endif %}" href="{{ url_for('admin_about_route') }}">About Us</a>
                <button type="button" class="btn btn-outline-danger btn-sm ms-3" id="exit-prompt">Exit</button>
            </div>
        </div>
    </nav>

    <dialog id="exit-modal">
        <p>Are you sure that you want to exit?</p>
        <a  href="{{ url_for('exit_admin_route') }}"><button type="button">Confirm</button></a>
        <button type="button" id="exit-cancel-modal">Cancel</button>
    </dialog>
    
    {% endif %}

    <div class="notification-bar container mt-4"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <main class="container py-4">{% block content %}{% endblock %}</main>
</body>
</html>
