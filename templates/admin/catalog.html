{% extends "admin/base.html" %}

{% block content %}

<div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between mb-4">
    <h1 class="mb-3 mb-md-0">Catalog</h1>
    <a href="{{ url_for('admin_add_route') }}" class="btn btn-success">Add Item</a>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 admin-catalog-cards catalog_cards"></div>

<dialog id="admin-item-card-modal">
    <div class="modal-media-layout">
        <img src="" id="admin-item-image-modal" alt="FTL">
        <div class="modal-copy">
            <p id="admin-item-category-modal"></p>
            <strong id="admin-item-name-modal"></strong>
            <p id="admin-item-description-modal"></p>
        </div>
    </div>
    <p id="admin-item-price-modal"></p>
    <button type="button" id="admin-item-close-modal">Close</button>
</dialog>

{% endblock %}
