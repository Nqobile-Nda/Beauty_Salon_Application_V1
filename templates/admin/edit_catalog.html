{% extends "admin/base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-4">Edit Item</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Item ID</label>
                <input class="form-control" name="item_id" title="item_id" value="{{ item.item_id }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" name="item_name" title="item_name" value="{{ item.name }}" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control" name="item_price" title="item_price" value="{{ item.price }}" type="number" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input class="form-control" name="item_category" title="item_category" value="{{ item.category }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Picture</label>
                <input class="form-control" name="item_image" title="item_image" type="file" value="{{ item.image }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="item_description" title="item_description" rows="3">{{ item.description }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('admin_catalog_route') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
