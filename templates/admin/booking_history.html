{% extends "admin/base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Booking History</h1>
    <a href="{{ url_for('admin_booking_requests_route') }}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row row-cols-1 row-cols-md-2 g-4">
{% for item in booking_requests %}
    <div class="col">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ item.full_name }}</h5>
                <p class="card-text mb-1">Status: {{ item.status }}</p>
            </div>
        </div>
    </div>
{% endfor %}
</div>

{% endblock %}
