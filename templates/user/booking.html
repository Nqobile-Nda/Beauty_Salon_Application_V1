{% extends "user/base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-4">Booking Request</h1>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Chosen Service</label>
                <select class="form-select" name="selected-service" id="selected-service" title="selected-service" required>
                    <option value="" disabled {% if not selected_service %}selected{% endif %}>Choose a service:</option>
                    <option {% if selected_service == "Hairstyles" %}selected{% endif %}>Hairstyles</option>
                    <option {% if selected_service == "Wigs" %}selected{% endif %}>Wigs</option>
                    <option {% if selected_service == "Nails" %}selected{% endif %}>Nails</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control" type="text" id="name" name="full_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" type="tel" id="phone" name="phone" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="date">Date</label>
                    <input class="form-control" type="date" id="date" name="date" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="time">Time</label>
                    <input class="form-control" type="time" id="time" name="time" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" id="message" title="message" rows="4">Hello World</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Book Now</button>
        </form>
    </div>
</div>
{% endblock %}
