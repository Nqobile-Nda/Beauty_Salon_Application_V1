{% extends "user/base.html" %}

{% block content %}
<h1>Booking Request</h1>
<form method="POST" id="booking-request-form">
    <label for="selected-service">Chosen Service:</label>
    <select name="selected-service" id="selected-service" title="selected-service" required>
        <option value="" disabled {% if not selected_service %}selected{% endif %}>Choose a service:</option>
        <option>Hairstyles</option>
        <option>Wigs</option>
        <option>Nails</option>
    </select>
    
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="full_name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="date">Date:</label>
    <input type="date" id="date" name="date" required>

    <label for="time">Time:</label>
    <input type="time" id="time" name="time" required>
    <p id="availability-status" class="availability-status" aria-live="polite"></p>

    <label for="message">Message:</label>
    <textarea type="text" name="message" id="message" title="message">Hello World</textarea>

    <button type="submit" id="booking-submit">Book Now</button>
</form>
{% endblock %}
